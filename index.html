<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laberinto</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #00ffcc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 6rem;
      margin-bottom: 160px;
      text-shadow: 0 0 60px #00ffcc90;
      letter-spacing: 10px;
    }
    .btn {
      width: 500px;
      max-width: 90%;
      padding: 35px;
      margin: 35px 0;
      font-size: 2.8rem;
      font-weight: bold;
      text-align: center;
      background: linear-gradient(135deg, #00ffcc, #00aa88);
      color: #000;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 0 50px #00ffcc90;
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 70px #00ffcc;
    }
    .btn.secondary {
      background: linear-gradient(135deg, #333, #111);
      color: #00ffcc;
      border: 4px solid #00ffcc70;
    }
  </style>
</head>
<body>

  <h1>LABERINTO</h1>
  <button class="btn" id="loginBtn">Iniciar sesión</button>
  <button class="btn secondary" id="registerBtn">Crear cuenta</button>

  <script>
    document.getElementById('registerBtn').addEventListener('click', () => {
      window.location.href = "login.html";
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      window.location.href = "game.html";
    });
  </script>
</body>
</html>
