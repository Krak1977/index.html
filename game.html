<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laberinto - Juego</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #00ffcc;
      overflow: hidden;
    }

    #nickScreen {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    #nickInput {
      width: 420px;
      max-width: 90%;
      padding: 22px;
      font-size: 1.9rem;
      background: #111;
      border: 4px solid #00ffcc;
      border-radius: 12px;
      color: white;
      margin: 50px 0;
      text-align: center;
    }

    #startGameBtn {
      padding: 24px 100px;
      font-size: 2.2rem;
      background: #00ffcc;
      color: black;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }

    #gameContainer {
      display: none;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1.7rem;
      z-index: 10;
    }

    #message {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 2.2rem;
      z-index: 10;
    }

    canvas {
      background: #0a0a0a;
      box-shadow: 0 0 60px #00ffcc80;
      margin-top: 140px;
    }
  </style>
</head>
<body>

<div id="nickScreen">
  <h2 style="font-size: 4rem; margin-bottom: 60px;">¡Listo para jugar!</h2>
  <p style="font-size: 1.8rem; margin-bottom: 50px;">Elige tu nick de jugador</p>
  <input id="nickInput" type="text" placeholder="Tu nick aquí..." maxlength="20">
  <button id="startGameBtn">JUGAR</button>
</div>

<div id="gameContainer">
  <div id="hud">
    Jugador: <span id="playerNick">---</span>  
        Tiempo: <span id="timer">0.00 s</span>
  </div>
  <div id="message"></div>
  <canvas id="game"></canvas>
</div>

<script>
  let currentUser = { username: "" };
  let startTime = null;
  let timerInterval = null;

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKlQfNhnt3JDF4lvu5RogHcZtxAA0mXK_PJU1smaRvSWO-SCUDP8gpnZ11pAUnPxax/exec";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const cols = 20;
  const rows = 20;
  const cellSize = 30;

  canvas.width = cols * cellSize;
  canvas.height = rows * cellSize;

  let maze = [];
  let path = [];

  class Cell {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.walls = [true, true, true, true];
      this.visited = false;
    }
    draw() {
      const x = this.x * cellSize;
      const y = this.y * cellSize;
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 4;
      if (this.walls[0]) drawLine(x, y, x + cellSize, y);
      if (this.walls[1]) drawLine(x + cellSize, y, x + cellSize, y + cellSize);
      if (this.walls[2]) drawLine(x, y + cellSize, x + cellSize, y + cellSize);
      if (this.walls[3]) drawLine(x, y, x, y + cellSize);
    }
  }

  function drawLine(x1,y1,x2,y2) {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  function index(x,y) {
    if (x<0||y<0||x>=cols||y>=rows) return -1;
    return x + y*cols;
  }

  function generateMaze() {
    maze = [];
    for (let y=0; y<rows; y++) for (let x=0; x<cols; x++) maze.push(new Cell(x,y));
    
    let current = maze[0];
    current.visited = true;
    let stack = [current];

    while (stack.length) {
      let neighbors = getUnvisitedNeighbors(current);
      if (neighbors.length) {
        let next = neighbors[Math.floor(Math.random()*neighbors.length)];
        removeWalls(current, next);
        next.visited = true;
        stack.push(current);
        current = next;
      } else current = stack.pop();
    }
  }

  function getUnvisitedNeighbors(cell) {
    let n = [];
    let t = maze[index(cell.x, cell.y-1)];
    let r = maze[index(cell.x+1, cell.y)];
    let b = maze[index(cell.x, cell.y+1)];
    let l = maze[index(cell.x-1, cell.y)];
    if (t && !t.visited) n.push(t);
    if (r && !r.visited) n.push(r);
    if (b && !b.visited) n.push(b);
    if (l && !l.visited) n.push(l);
    return n;
  }

  function removeWalls(a,b) {
    let dx = a.x - b.x;
    let dy = a.y - b.y;
    if (dx===1)  { a.walls[3]=false; b.walls[1]=false; }
    if (dx===-1) { a.walls[1]=false; b.walls[3]=false; }
    if (dy===1)  { a.walls[0]=false; b.walls[2]=false; }
    if (dy===-1) { a.walls[2]=false; b.walls[0]=false; }
  }

  const player = { x:0, y:0, size: cellSize*0.6 };
  const goal   = { x:cols-1, y:rows-1 };

  function drawPlayer() {
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(player.x*cellSize + cellSize*0.2, player.y*cellSize + cellSize*0.2, player.size, player.size);
  }

  function drawGoal() {
    ctx.fillStyle = "#ff0055";
    ctx.fillRect(goal.x*cellSize + cellSize*0.3, goal.y*cellSize + cellSize*0.3, cellSize*0.4, cellSize*0.4);
  }

  function drawTrail() {
    ctx.fillStyle = "rgba(0,255,204,0.5)";
    path.forEach(pos => {
      ctx.fillRect(pos.x*cellSize + cellSize*0.35, pos.y*cellSize + cellSize*0.35, cellSize*0.3, cellSize*0.3);
    });
  }

  function movePlayer(dx, dy) {
    let cell = maze[index(player.x, player.y)];
    let nx = player.x + dx;
    let ny = player.y + dy;

    if (nx<0 || nx>=cols || ny<0 || ny>=rows) return;
    if (dx===-1 && cell.walls[3]) return;
    if (dx===1  && cell.walls[1]) return;
    if (dy===-1 && cell.walls[0]) return;
    if (dy===1  && cell.walls[2]) return;

    if (path.length > 1) {
      let prev = path[path.length-2];
      if (prev.x === nx && prev.y === ny) {
        path.pop();
        player.x = nx; player.y = ny;
        return;
      }
    }

    player.x = nx;
    player.y = ny;
    path.push({x:nx, y:ny});

    if (nx === goal.x && ny === goal.y) {
      const timeSec = (performance.now() - startTime) / 1000;
      startTime = null;
      clearInterval(timerInterval);

      document.getElementById("message").textContent = 
        `¡Ganaste en ${timeSec.toFixed(2)} s! Pulsa R para reiniciar`;

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: currentUser.username,
          time: timeSec.toFixed(2)
        })
      });
    }
  }

  window.addEventListener("keydown", e => {
    if (!startTime) return;
    let dx=0, dy=0;
    if (e.key==="ArrowUp"   || e.key.toLowerCase()==="w") dy=-1;
    if (e.key==="ArrowDown" || e.key.toLowerCase()==="s") dy=1;
    if (e.key==="ArrowLeft" || e.key.toLowerCase()==="a") dx=-1;
    if (e.key==="ArrowRight"|| e.key.toLowerCase()==="d") dx=1;
    if (dx===0 && dy===0) return;

    movePlayer(dx, dy);

    if (e.key.toLowerCase() === "r") {
      generateMaze();
      path = [{x:0, y:0}];
      player.x = 0;
      player.y = 0;
      startTime = performance.now();
      document.getElementById("message").textContent = "";
      timerInterval = setInterval(updateTimer, 50);
    }
  });

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    maze.forEach(c => c.draw());
    drawTrail();
    drawGoal();
    drawPlayer();
    requestAnimationFrame(draw);
  }

  function updateTimer() {
    if (!startTime) return;
    const elapsed = (performance.now() - startTime) / 1000;
    document.getElementById("timer").textContent = elapsed.toFixed(2) + " s";
  }

  document.getElementById('startGameBtn').addEventListener('click', () => {
    const nick = document.getElementById('nickInput').value.trim();
    if (!nick) {
      alert("Pon un nick para continuar");
      return;
    }

    currentUser.username = nick;
    document.getElementById('playerNick').textContent = nick;
    document.getElementById('nickScreen').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'flex';

    generateMaze();
    path = [{x:0, y:0}];
    player.x = 0;
    player.y = 0;
    startTime = performance.now();
    timerInterval = setInterval(updateTimer, 50);
    draw();
  });
</script>
</body>
</html>
